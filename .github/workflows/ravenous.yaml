name: Ravenous source checks

'on':
  push:
    branches: [ravenous]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.5
      # Application integration tests live in the parent Ravenous repository.
      - name: Lint Ravenous source
        run: |
          python -m ruff check --isolated --select E4,E7,E9,F,I --target-version py310 \
            backend/open_webui/ravenous* backend/open_webui/retrieval/ravenous_union_rerank.py
      - name: Compile Ravenous source
        run: python -m compileall -q backend/open_webui/ravenous* backend/open_webui/retrieval/ravenous_union_rerank.py
